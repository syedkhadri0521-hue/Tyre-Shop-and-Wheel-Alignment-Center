<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TyrePro</title>

    
    <link rel="stylesheet" href="auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

<section class="login-section">

    <div class="login-card">

        <!-- Logo + Dark Mode -->

        <div class="login-top">

            <div class="login-logo">

                <a href="Index.html"><img src="images/vecteezy_tire-vector-icon-design_25618016.jpg" alt="TyrePro Logo"></a>

                <div>

                    <h2>Tyre<span class="tagline">Pro</span></h2>

                    <p>Premium Auto Care</p>

                </div>

            </div>

            <button id="themeToggle" class="theme-btn">

                <i class="bi bi-moon-stars-fill"></i>

            </button>

        </div>

        <span class="section-tag">

            Welcome Back

        </span>

        <h1>Login to Your Account</h1>

        <p class="login-text">

            Sign in to manage bookings, appointments and enjoy premium tyre services.

        </p>

        <form class="login-form">

            <div class="input-group">

                <label>Email Address</label>

               <input
    type="email"
    id="loginEmail"
    placeholder="Enter your email"
    required
>

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
    type="password"
    id="loginPassword"
    placeholder="Enter your password"
    required
>

                    <button
                        type="button"
                        class="password-toggle"
                    >

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            <div class="login-options">

                <label class="remember">

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button
    type="submit"
    class="login-btn">

                Login

            </button>

        </form>

        <div class="login-footer">

            <p>

                Don't have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </p>

        </div>

    </div>

</section>


<script src="auth.js"></script>
</body>
</html>
