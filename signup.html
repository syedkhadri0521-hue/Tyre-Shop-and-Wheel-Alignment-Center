<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | TyrePro</title>

   
    <link rel="stylesheet" href="auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

    <section class="login-section">

        <div class="login-card">

            <!-- Logo & Dark Mode -->

            <div class="login-top">

                <div class="login-logo">

                  <a href="Index.html"><img src="images/vecteezy_tire-vector-icon-design_25618016.jpg" alt="TyrePro Logo"></a>

                    <div>

                        <h2>Tyre<span>Pro</span></h2>

                        <p>Premium Auto Care</p>

                    </div>

                </div>

                <button id="themeToggle" class="theme-btn">

                    <i class="bi bi-moon-stars-fill"></i>

                </button>

            </div>

            <span class="section-tag">

                Join Us

            </span>

            <h1>Create Your Account</h1>

            <p class="login-text">

                Register today to book tyre services and manage your appointments easily.

            </p>

            <form class="signup-form">

                <div class="signup-grid">

                    <div class="input-group">

                        <label>Full Name</label>

                        <input type="text" id="name" placeholder="Full Name" required>

                    </div>

                    <div class="input-group">

                        <label>Email Address</label>

                        <input type="email" id="email" placeholder="Email Address" required>

                    </div>

                    <div class="input-group">

                        <label>Phone Number</label>

                        <input type="tel" id="phone" placeholder="Phone Number" required>

                    </div>

                    <div class="input-group">

                        <label>Password</label>

                        <div class="password-box">

                            <input type="password" id="password" placeholder="Password" required>

                            <button type="button" class="password-toggle">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>

                </div>

                <div class="input-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                        <button type="button" class="password-toggle">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox" id="terms" required>

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <button type="submit" class="login-btn">

                    Create Account

                </button>
                <div class="divider">
    <span>OR</span>
</div>

<div class="social-login">

    <a href="#" class="social-btn google">

        <i class="bi bi-google"></i>

        Continue with Google

    </a>

    <a href="#" class="social-btn apple">

        <i class="bi bi-apple"></i>

        Continue with Apple

    </a>

</div>

            </form>

            <div class="login-footer">

                <p>

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </section>

  
    <script src="auth.js"></script>
</body>

</html>
